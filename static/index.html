<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Find Cheap Flights</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 600px;
            margin: 40px auto;
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }

        h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 32px;
        }

        .subtitle {
            color: #666;
            margin-bottom: 30px;
            font-size: 16px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 500;
        }

        input, select {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 16px;
            transition: border-color 0.3s;
        }

        input:focus, select:focus {
            outline: none;
            border-color: #667eea;
        }

        button {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.4);
        }

        button:active {
            transform: translateY(0);
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .loading {
            text-align: center;
            padding: 20px;
            color: #667eea;
            display: none;
        }

        .spinner {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 10px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .results {
            margin-top: 30px;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 10px;
            display: none;
        }

        .results h2 {
            color: #333;
            margin-bottom: 15px;
            font-size: 24px;
        }

        .result-content {
            color: #333;
            line-height: 1.8;
            white-space: pre-wrap;
            font-size: 15px;
        }

        .error {
            background: #fee;
            border-left: 4px solid #f44;
            padding: 15px;
            margin-top: 20px;
            border-radius: 5px;
            color: #c33;
            display: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>✈️ Find Cheap Flights</h1>
        <p class="subtitle">Powered by Duffel - Search the best flight deals to Portland</p>

        <form id="searchForm">
            <div class="form-group">
                <label for="origin">Flying from (city or airport code)</label>
                <input type="text" id="origin" placeholder="e.g., Nashville or BNA" required>
            </div>

            <div class="form-group">
                <label for="date">Departure date</label>
                <input type="date" id="date" required>
            </div>

            <div class="form-group">
                <label for="returnDate">Return date</label>
                <input type="date" id="returnDate" required>
            </div>

            <div class="form-group">
                <label for="passengers">Number of passengers</label>
                <select id="passengers">
                    <option value="1">1 passenger</option>
                    <option value="2">2 passengers</option>
                    <option value="3">3 passengers</option>
                    <option value="4">4 passengers</option>
                    <option value="5">5 passengers</option>
                    <option value="6">6 passengers</option>
                </select>
            </div>

            <div class="form-group">
                <label for="sortBy">Search preference</label>
                <select id="sortBy">
                    <option value="total_amount">Cheapest flights</option>
                    <option value="total_duration">Fastest flights</option>
                </select>
            </div>

            <div class="form-group">
                <label for="maxBudget">Max budget per passenger (optional)</label>
                <input type="number" id="maxBudget" placeholder="e.g., 500" min="0" step="50">
                <small style="color: #666; font-size: 13px;">Leave empty for no limit</small>
            </div>

            <button type="submit" id="searchBtn">Search Flights</button>
        </form>

        <div class="loading" id="loading">
            <div class="spinner"></div>
            <p>Searching for the best deals...</p>
        </div>

        <div class="error" id="error"></div>

        <div class="results" id="results">
            <h2>Flight Results</h2>
            <div class="result-content" id="resultContent"></div>
        </div>
    </div>

    <script>
        const form = document.getElementById('searchForm');
        const loading = document.getElementById('loading');
        const results = document.getElementById('results');
        const resultContent = document.getElementById('resultContent');
        const errorDiv = document.getElementById('error');
        const searchBtn = document.getElementById('searchBtn');

        // Get API URL from current location
        const API_URL = window.location.origin;

        form.addEventListener('submit', async (e) => {
            e.preventDefault();

            const origin = document.getElementById('origin').value;
            const date = document.getElementById('date').value;
            const returnDate = document.getElementById('returnDate').value;
            const passengers = document.getElementById('passengers').value;
            const sortBy = document.getElementById('sortBy').value;
            const maxBudget = document.getElementById('maxBudget').value;

            // Hide previous results/errors
            results.style.display = 'none';
            errorDiv.style.display = 'none';

            // Show loading
            loading.style.display = 'block';
            searchBtn.disabled = true;

            try {
                const payload = {
                    origin: origin,
                    departure_date: date,
                    return_date: returnDate,
                    passengers: parseInt(passengers),
                    destination: "Portland, Oregon, PDX",
                    sort_by: sortBy
                };

                // Add budget filter if specified
                if (maxBudget && maxBudget > 0) {
                    payload.max_budget_per_passenger = parseFloat(maxBudget);
                }

                const response = await fetch(`${API_URL}/search-dual`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(payload)
                });

                if (!response.ok) {
                    throw new Error(`Server error: ${response.status}`);
                }

                const data = await response.json();

                // Show results
                loading.style.display = 'none';
                results.style.display = 'block';
                resultContent.textContent = data.results;

            } catch (error) {
                loading.style.display = 'none';
                errorDiv.style.display = 'block';
                errorDiv.textContent = `Error: ${error.message}. Make sure the API is running.`;
            } finally {
                searchBtn.disabled = false;
            }
        });

        // Set min date to today
        const today = new Date().toISOString().split('T')[0];
        document.getElementById('date').setAttribute('min', today);
        document.getElementById('returnDate').setAttribute('min', today);

        // Auto-set return date when departure changes
        document.getElementById('date').addEventListener('change', (e) => {
            const depDate = new Date(e.target.value);
            depDate.setDate(depDate.getDate() + 5); // Default 5 days later
            const returnDate = depDate.toISOString().split('T')[0];
            document.getElementById('returnDate').value = returnDate;
        });
    </script>
</body>
</html>
