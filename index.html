{% extends "base.html" %}
{% block content %}

<form class="search-form" action="/search" method="get">
    <div class="form-group">
        <label>From</label>
        <input type="text" name="origin" placeholder="BNA, LAX, JFK..." required>
    </div>
    <div class="form-group">
        <label>To</label>
        <input type="text" name="destination" placeholder="LAX, JFK, MIA..." required>
    </div>
    <div class="form-group">
        <label>Depart</label>
        <input type="date" name="depart_date" required>
    </div>
    <div class="form-group">
        <label>Return (optional)</label>
        <input type="date" name="return_date">
    </div>
    <div class="form-group">
        <label>Max Price USD (optional)</label>
        <input type="number" name="max_price" placeholder="e.g. 300" min="0" step="10">
    </div>
    <div class="form-group">
        <button type="submit" class="btn">Search Flights</button>
    </div>
</form>

<h3>Quick searches from Nashville</h3>
<div class="quick-links">
    {% for d in destinations %}
    <a href="/search?origin={{ nashville }}&destination={{ d.code }}&depart_date=2026-06-15">{{ d.city }}</a>
    {% endfor %}
</div>

{% endblock %}
